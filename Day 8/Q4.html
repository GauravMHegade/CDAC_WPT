<!-- use HTML predefined Validations 
     required  , minlength , maxlength 
    and display error message if data is not properly entered -->
    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Required Field Validation</title>
</head>

<body>
    <form>
        Username:<input type="text" id="username" name="username" required /><br /><br />

        Password:<input type="password" id="password" name="password" required minlength="5"
            maxlength="10" /><br /><br />

        <button type="submit">Submit</button>
    </form>
</body>

</html>
