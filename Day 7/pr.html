<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
    </style>
</head>

<body>
    <div
        style="background-color: rgb(127, 255, 212); border: 1px solid black; border-radius: 5px; height: 100px; width: 100px; text-align: center; margin: 10px; padding: 10px; position: relative;">
        Div</div>
    <button>Animate</button>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        for (let i = 0; i < 10; i++) {
            
            $("button").click(function () {
            $("div").animate({ left: "500px",top:"0px", right:"0px", bottom:"0px"}, 800)
            $("div").animate({ left: "500px",top:"300px", right:"0px", bottom:"0px"}, 100)
            $("div").animate({ left: "0px",top:"300px", right:"500px", bottom:"0px"}, 800)
            $("div").animate({ left: "0px",top:"0px", right:"500px", bottom:"300px"}, 800)
           
        })
        }
        
    </script>
</body>

</html>
