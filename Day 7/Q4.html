<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            color: black;
            font-style: italic;
            font-size: 20px;
            color: rgb(0 147 255);
        }
    </style>
</head>

<body>
    <div style="background-color: rgb(158, 211, 193); border: 1px solid black; border-radius: 5px; height: 105px; width: 130px; text-align: center; margin: 10px; padding: 10px; position: relative;">
        "In the middle of every difficulty lies opportunity."</div>
    <button>Animate</button>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        for (let i = 0; i < 4; i++) {
            
            $("button").click(function () {
            $("div").animate({ left: "900px",top:"0px", right:"0px", bottom:"0px"}, 2000)
            // $("div").animate({ left: "500px",top:"300px", right:"0px", bottom:"0px"}, 100)
            // $("div").animate({ left: "0px",top:"300px", right:"500px", bottom:"0px"}, 800)
            $("div").animate({ left: "0px",top:"0px", right:"900px", bottom:"0px"}, 2000)
           
        })
        }
        
    </script>
</body>

</html>
